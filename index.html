<!doctype html>
<html lang="th">
  <head>

    <title>Meet X TH</title>
    <style>

        background: #f4f7fb;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(34rem, calc(100% - 3rem));

    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js",

        }
      }

    <script type="module" src="./src/main.js"></script>

  <body>
    <main>
      <h1>Meet X TH</h1>
      <p>เว็บแอปสำหรับการพบปะออนไลน์ในประเทศไทย</p>
