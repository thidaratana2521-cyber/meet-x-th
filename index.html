<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meets'x Thailand</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>body{font-family:Inter,'Noto Sans Thai',sans-serif}.bg-app{background:linear-gradient(135deg,#f5f3ff,#eef7ff,#fdf4ff)}.glass{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(18px)}.no-scrollbar::-webkit-scrollbar{display:none}.bubble-mine{background:#7c3aed;color:white;border-radius:18px 18px 4px 18px}.bubble-theirs{background:white;border:1px solid #ede9fe;color:#334155;border-radius:18px 18px 18px 4px}</style>
</head>
<body class="bg-app min-h-screen text-slate-800">
  <div id="loading" class="fixed inset-0 z-50 grid place-items-center bg-white"><div class="text-center"><div class="mx-auto mb-3 h-10 w-10 animate-spin rounded-full border-4 border-violet-200 border-t-violet-600"></div><p class="text-sm text-slate-500">กำลังโหลด Meets'x...</p></div></div>

  <div id="authPage" class="hidden min-h-screen items-center justify-center p-4">
    <div class="glass w-full max-w-md rounded-[32px] p-6 shadow-2xl shadow-violet-200/40 sm:p-8">
      <div class="mb-7 text-center">
        <div class="mx-auto mb-3 grid h-14 w-14 place-items-center rounded-2xl bg-gradient-to-br from-violet-600 to-sky-500 text-2xl font-black text-white shadow-lg">M</div>
        <h1 class="text-2xl font-extrabold">Meets'x Thailand</h1>
        <p id="authSubtitle" class="mt-1 text-sm text-slate-500">เข้าสู่ระบบเพื่อเริ่มใช้งาน</p>
      </div>
      <form id="authForm" class="space-y-4">
        <div id="nameField" class="hidden"><label class="mb-1 block text-xs font-semibold">ชื่อที่แสดง</label><input id="displayName" type="text" placeholder="ชื่อของคุณ" class="w-full rounded-2xl border border-violet-100 bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-violet-300"></div>
        <div><label class="mb-1 block text-xs font-semibold">อีเมล</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.com" class="w-full rounded-2xl border border-violet-100 bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-violet-300"></div>
        <div><label class="mb-1 block text-xs font-semibold">รหัสผ่าน</label><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="อย่างน้อย 6 ตัวอักษร" class="w-full rounded-2xl border border-violet-100 bg-white px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-violet-300"></div>
        <button id="authSubmit" type="submit" class="w-full rounded-2xl bg-gradient-to-r from-violet-600 to-sky-500 py-3 text-sm font-bold text-white shadow-lg shadow-violet-200">เข้าสู่ระบบ</button>
      </form>
      <p id="authError" class="mt-3 hidden rounded-xl bg-rose-50 px-3 py-2 text-xs text-rose-600"></p>
      <button id="forgotPassword" type="button" class="mt-4 w-full text-center text-xs font-semibold text-violet-600">ลืมรหัสผ่าน?</button>
      <div class="my-5 border-t border-violet-100"></div>
      <button id="authModeBtn" type="button" class="w-full rounded-2xl bg-violet-50 py-3 text-sm font-bold text-violet-700">ยังไม่มีบัญชี? สมัครสมาชิก</button>
    </div>
  </div>

  <div id="appPage" class="hidden min-h-screen">
    <header class="sticky top-0 z-30 border-b border-white/60 bg-white/75 px-3 py-2 backdrop-blur-xl sm:px-5">
      <div class="mx-auto flex max-w-6xl items-center justify-between">
        <button id="goHome" class="flex items-center gap-2"><div class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-violet-600 to-sky-500 font-black text-white">M</div><span class="hidden text-lg font-extrabold sm:block">Meets'x</span></button>
        <nav class="flex gap-1 rounded-full bg-violet-50 p-1">
          <button data-view="feed" class="navBtn rounded-full bg-violet-600 px-4 py-2 text-xs font-bold text-white"><span class="hidden sm:inline">หน้าหลัก</span><i data-lucide="home" class="h-4 w-4 sm:hidden"></i></button>
          <button data-view="people" class="navBtn rounded-full px-4 py-2 text-xs font-bold text-slate-600"><span class="hidden sm:inline">สมาชิก</span><i data-lucide="users" class="h-4 w-4 sm:hidden"></i></button>
          <button data-view="messages" class="navBtn rounded-full px-4 py-2 text-xs font-bold text-slate-600"><span class="hidden sm:inline">Messenger</span><i data-lucide="message-circle" class="h-4 w-4 sm:hidden"></i></button>
        </nav>
        <div class="flex items-center gap-2"><button id="profileBtn" class="h-9 w-9 overflow-hidden rounded-full border-2 border-violet-200 bg-violet-100"><img id="headerAvatar" class="h-full w-full object-cover" alt=""></button><button id="logoutBtn" title="ออกจากระบบ" class="grid h-9 w-9 place-items-center rounded-full bg-white text-slate-500 shadow"><i data-lucide="log-out" class="h-4 w-4"></i></button></div>
      </div>
    </header>

    <main class="mx-auto max-w-6xl p-3 sm:p-5">
      <section id="feedView" class="grid gap-4 md:grid-cols-[220px_minmax(0,620px)_220px]">
        <aside class="hidden space-y-3 md:block"><div class="glass rounded-3xl p-4"><div class="flex items-center gap-3"><img id="sideAvatar" class="h-12 w-12 rounded-full object-cover" alt=""><div class="min-w-0"><p id="sideName" class="truncate text-sm font-bold"></p><p id="sideEmail" class="truncate text-[11px] text-slate-400"></p></div></div></div></aside>
        <div class="space-y-4">
          <div class="glass rounded-3xl p-4"><textarea id="postText" rows="3" placeholder="คุณกำลังคิดอะไรอยู่..." class="w-full resize-none rounded-2xl border border-violet-100 bg-white/70 px-4 py-3 text-sm outline-none"></textarea><div class="mt-3 flex justify-end"><button id="publishPost" class="rounded-full bg-violet-600 px-5 py-2 text-xs font-bold text-white">โพสต์สาธารณะ</button></div></div>
          <div id="postsList" class="space-y-4"></div>
        </div>
        <aside class="hidden md:block"><div class="glass rounded-3xl p-4"><h3 class="mb-3 text-sm font-bold">สมาชิกมาใหม่</h3><div id="suggestedUsers" class="space-y-3"></div></div></aside>
      </section>

      <section id="peopleView" class="hidden"><div class="glass rounded-3xl p-4 sm:p-6"><h2 class="mb-4 text-lg font-bold">สมาชิกทั้งหมด</h2><div id="peopleList" class="grid gap-3 sm:grid-cols-2"></div></div></section>

      <section id="messagesView" class="hidden"><div class="glass mx-auto h-[calc(100vh-130px)] max-w-5xl overflow-hidden rounded-3xl md:grid md:grid-cols-[280px_1fr]"><aside class="border-r border-violet-100"><div class="flex items-center justify-between border-b border-violet-100 p-4"><h2 class="font-bold">แชต</h2><i data-lucide="edit-3" class="h-4 w-4 text-violet-600"></i></div><div id="chatContacts" class="no-scrollbar h-[calc(100%-65px)] overflow-y-auto p-2"></div></aside><div class="hidden h-full grid-rows-[64px_minmax(0,1fr)_68px] md:grid" id="chatPanel"><div class="flex items-center gap-3 border-b border-violet-100 px-4"><img id="chatPartnerAvatar" class="h-9 w-9 rounded-full bg-violet-100 object-cover" alt=""><div><p id="chatPartnerName" class="text-sm font-bold">เลือกบทสนทนา</p><p class="text-[10px] text-emerald-500">Messenger</p></div></div><div id="chatMessages" class="no-scrollbar overflow-y-auto bg-slate-50/40 p-4"></div><form id="chatForm" class="flex items-center gap-2 border-t border-violet-100 p-3"><input id="chatInput" class="flex-1 rounded-full border border-violet-100 bg-white px-4 py-2.5 text-sm outline-none" placeholder="Aa"><button class="grid h-10 w-10 place-items-center rounded-full bg-violet-600 text-white"><i data-lucide="send" class="h-4 w-4"></i></button></form></div></div></section>

      <section id="profileView" class="hidden"><div class="glass mx-auto max-w-xl rounded-3xl p-6"><h2 class="mb-5 text-lg font-bold">แก้ไขโปรไฟล์</h2><label class="mb-1 block text-xs font-semibold">ชื่อที่แสดง</label><input id="profileName" class="mb-4 w-full rounded-2xl border border-violet-100 px-4 py-3 text-sm"><label class="mb-1 block text-xs font-semibold">รูปโปรไฟล์ (URL)</label><input id="profileAvatar" class="mb-5 w-full rounded-2xl border border-violet-100 px-4 py-3 text-sm"><button id="saveProfile" class="w-full rounded-2xl bg-violet-600 py-3 text-sm font-bold text-white">บันทึกโปรไฟล์</button></div></section>
    </main>
  </div>

  <div id="toast" class="pointer-events-none fixed bottom-5 left-1/2 z-50 -translate-x-1/2 rounded-full bg-slate-900 px-5 py-2.5 text-xs font-semibold text-white opacity-0 transition"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, signOut, updateProfile, deleteUser } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot, query, orderBy, where, serverTimestamp, updateDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    const config = window.MEETSX_FIREBASE_CONFIG || null;
    const authPage=document.getElementById('authPage'),appPage=document.getElementById('appPage'),loading=document.getElementById('loading');
    let app,auth,db,currentUser=null,authMode='login',members=[],posts=[],selectedPartner=null,unsubs=[];

    const $=id=>document.getElementById(id);
    function toast(text){const el=$('toast');el.textContent=text;el.classList.remove('opacity-0');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('opacity-0'),2600)}
    function esc(s=''){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

    async function boot(){
      const saved=localStorage.getItem('meetsxFirebaseConfig');
      try{if(saved)window.MEETSX_FIREBASE_CONFIG=JSON.parse(saved)}catch{}
      if(!window.MEETSX_FIREBASE_CONFIG?.apiKey){
        loading.classList.add('hidden'); authPage.classList.remove('hidden');authPage.classList.add('flex');
        $('authError').textContent='ต้องเพิ่ม Firebase Config ก่อนใช้งาน กรุณากำหนด window.MEETSX_FIREBASE_CONFIG หรือคีย์ meetsxFirebaseConfig ใน localStorage';$('authError').classList.remove('hidden');
        return;
      }
      app=initializeApp(window.MEETSX_FIREBASE_CONFIG);auth=getAuth(app);db=getFirestore(app);
      onAuthStateChanged(auth,user=>{currentUser=user;if(user)enterApp(user);else enterAuth()});
    }

    function enterAuth(){unsubs.forEach(fn=>fn());loading.classList.add('hidden');appPage.classList.add('hidden');authPage.classList.remove('hidden');authPage.classList.add('flex')}
    async function enterApp(user){authPage.classList.add('hidden');authPage.classList.remove('flex');appPage.classList.remove('hidden');loading.classList.add('hidden');
      await ensureProfile(user);syncProfile();subscribeApp();switchView('feed')}

    async function ensureProfile(user){const ref=doc(db,'users',user.uid);const snap=await getDoc(ref);if(!snap.exists()){await setDoc(ref,{uid:user.uid,name:user.displayName||user.email.split('@')[0],email:user.email,avatar:`https://api.dicebear.com/9.x/thumbs/svg?seed=${encodeURIComponent(user.uid)}`,createdAt:serverTimestamp(),updatedAt:serverTimestamp()})}}
    async function syncProfile(){const snap=await getDoc(doc(db,'users',currentUser.uid));const data=snap.data()||{};['sideName','profileName'].forEach(id=>$(id).value?$(id).value=data.name||'':$(id).textContent=data.name||'');$('sideEmail').textContent=currentUser.email||'';$('profileName').value=data.name||'';$('profileAvatar').value=data.avatar||'';[$('headerAvatar'),$('sideAvatar')].forEach(el=>el.src=data.avatar||'')}

    function subscribeApp(){unsubs.push(onSnapshot(collection(db,'users'),snap=>{members=[];snap.forEach(d=>members.push({id:d.id,...d.data()}));renderPeople();renderContacts()},()=>toast('ไม่สามารถโหลดรายชื่อสมาชิกได้')));
      unsubs.push(onSnapshot(query(collection(db,'posts'),orderBy('createdAt','desc')),snap=>{posts=[];snap.forEach(d=>posts.push({id:d.id,...d.data()}));renderPosts()},()=>toast('ไม่สามารถโหลดโพสต์ได้')))}

    function renderPosts(){ $('postsList').innerHTML=posts.length?posts.map(p=>`<article class="glass rounded-3xl p-4"><div class="mb-3 flex items-center gap-3"><div class="grid h-10 w-10 place-items-center rounded-full bg-violet-100 text-sm font-bold text-violet-600">${esc((p.authorName||'M')[0])}</div><div><p class="text-sm font-bold">${esc(p.authorName||'สมาชิก')}</p><p class="text-[10px] text-slate-400">${p.createdAt?.toDate?time(p.createdAt.toDate()):'เมื่อสักครู่'}</p></div></div><p class="whitespace-pre-line text-sm">${esc(p.text)}</p></article>`).join(''):`<div class="glass rounded-3xl p-8 text-center text-sm text-slate-400">ยังไม่มีโพสต์ เป็นคนแรกเลย</div>`}
    function time(d){return d.toLocaleString('th-TH',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})}

    function renderPeople(){const others=members.filter(m=>m.id!==currentUser.uid);const html=others.map(m=>`<div class="flex items-center justify-between rounded-2xl bg-white/70 p-3"><div class="flex min-w-0 items-center gap-3"><img src="${esc(m.avatar||'')}" class="h-11 w-11 rounded-full object-cover" alt=""><div class="min-w-0"><p class="truncate text-sm font-bold">${esc(m.name||'สมาชิก')}</p><p class="truncate text-[10px] text-slate-400">${esc(m.email||'')}</p></div></div><button data-chat="${m.id}" class="rounded-full bg-violet-50 px-3 py-2 text-xs font-bold text-violet-600">แชต</button></div>`).join('');$('peopleList').innerHTML=html||'<p class="text-sm text-slate-400">ยังไม่มีสมาชิกคนอื่น</p>';$('suggestedUsers').innerHTML=html||'<p class="text-xs text-slate-400">ยังไม่มีสมาชิกคนอื่น</p>'}

    function renderContacts(){const others=members.filter(m=>m.id!==currentUser.uid);$('chatContacts').innerHTML=others.length?others.map(m=>`<button data-chat="${m.id}" class="flex w-full items-center gap-3 rounded-2xl px-3 py-3 text-left hover:bg-violet-50"><img src="${esc(m.avatar||'')}" class="h-11 w-11 rounded-full object-cover" alt=""><div class="min-w-0"><p class="truncate text-sm font-bold">${esc(m.name||'สมาชิก')}</p><p class="truncate text-[10px] text-slate-400">ส่งข้อความ</p></div></button>`).join(''):'<p class="p-4 text-xs text-slate-400">รอสมาชิกคนอื่นสมัคร</p>'}

    async function openChat(uid){const partner=members.find(m=>m.id===uid);if(!partner)return;selectedPartner=partner;$('chatPartnerName').textContent=partner.name||'สมาชิก';$('chatPartnerAvatar').src=partner.avatar||'';$('chatPanel').classList.remove('hidden');switchView('messages');subscribeMessages(uid)}

    function subscribeMessages(uid){if(window.chatUnsub)window.chatUnsub();const ids=[currentUser.uid,uid].sort();const threadId=ids.join('_');window.chatUnsub=onSnapshot(query(collection(db,'threads',threadId,'messages'),orderBy('createdAt','asc')),snap=>{const items=[];snap.forEach(d=>items.push(d.data()));$('chatMessages').innerHTML=items.length?items.map(m=>`<div class="mb-2 flex ${m.senderId===currentUser.uid?'justify-end':'justify-start'}"><div class="max-w-[75%] px-3 py-2 text-sm ${m.senderId===currentUser.uid?'bubble-mine':'bubble-theirs'}"><p>${esc(m.text)}</p></div></div>`).join(''):'<p class="py-16 text-center text-xs text-slate-400">เริ่มต้นบทสนทนาได้เลย</p>'; $('chatMessages').scrollTop=$('chatMessages').scrollHeight})}

    function switchView(view){['feed','people','messages','profile'].forEach(v=>$(v+'View').classList.toggle('hidden',v!==view));document.querySelectorAll('.navBtn').forEach(b=>{const active=b.dataset.view===view;b.className=`navBtn rounded-full px-4 py-2 text-xs font-bold ${active?'bg-violet-600 text-white':'text-slate-600'}`});lucide.createIcons()}

    $('authModeBtn').addEventListener('click',()=>{authMode=authMode==='login'?'signup':'login';$('nameField').classList.toggle('hidden',authMode==='login');$('password').autocomplete=authMode==='signup'?'new-password':'current-password';$('authSubtitle').textContent=authMode==='signup'?'สร้างบัญชีด้วยอีเมล':'เข้าสู่ระบบเพื่อเริ่มใช้งาน';$('authSubmit').textContent=authMode==='signup'?'สมัครสมาชิก':'เข้าสู่ระบบ';$('authModeBtn').textContent=authMode==='signup'?'มีบัญชีอยู่แล้ว? เข้าสู่ระบบ':'ยังไม่มีบัญชี? สมัครสมาชิก';$('authError').classList.add('hidden')});
    $('authForm').addEventListener('submit',async e=>{e.preventDefault();$('authSubmit').disabled=true;$('authError').classList.add('hidden');try{const email=$('email').value.trim(),password=$('password').value;if(authMode==='signup'){const cred=await createUserWithEmailAndPassword(auth,email,password);const name=$('displayName').value.trim()||email.split('@')[0];await updateProfile(cred.user,{displayName:name});await setDoc(doc(db,'users',cred.user.uid),{uid:cred.user.uid,name,email,avatar:`https://api.dicebear.com/9.x/thumbs/svg?seed=${encodeURIComponent(cred.user.uid)}`,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});toast('สมัครสมาชิกสำเร็จ')}else{await signInWithEmailAndPassword(auth,email,password);toast('เข้���สู่ระบบสำเร็จ')}}catch(err){$('authError').textContent=({ 'auth/email-already-in-use':'อีเมลนี้ถูกใช้งานแล้ว','auth/invalid-credential':'อีเมลหรือรหัสผ่านไม่ถูกต้อง','auth/weak-password':'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร','auth/invalid-email':'รูปแบบอีเมลไม่ถูกต้อง'}[err.code]||err.message);$('authError').classList.remove('hidden')}finally{$('authSubmit').disabled=false}});
    $('forgotPassword').addEventListener('click',async()=>{const email=$('email').value.trim();if(!email){$('authError').textContent='กรุณากรอกอีเมลก่อนขอรีเซ็ตรหัสผ่าน';$('authError').classList.remove('hidden');return}try{await sendPasswordResetEmail(auth,email);toast('ส่งลิงก์รีเซ็ตรหัสผ่านไปยังอีเมลแล้ว')}catch(err){toast(err.message)}});
    $('logoutBtn').addEventListener('click',async()=>{await signOut(auth);toast('ออกจากระบบแล้ว')});
    document.querySelectorAll('.navBtn').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));
    $('profileBtn').addEventListener('click',()=>switchView('profile'));$('goHome').addEventListener('click',()=>switchView('feed'));
    $('publishPost').addEventListener('click',async()=>{const text=$('postText').value.trim();if(!text)return toast('กรุณาพิมพ์ข้อความ');const snap=await getDoc(doc(db,'users',currentUser.uid));await addDoc(collection(db,'posts'),{text,authorId:currentUser.uid,authorName:snap.data()?.name||currentUser.email,createdAt:serverTimestamp()});$('postText').value='';toast('โพสต์เรียบร้อย')});
    $('saveProfile').addEventListener('click',async()=>{const name=$('profileName').value.trim(),avatar=$('profileAvatar').value.trim();if(!name)return toast('กรุณากรอกชื่อ');await updateDoc(doc(db,'users',currentUser.uid),{name,avatar,updatedAt:serverTimestamp()});await updateProfile(currentUser,{displayName:name});await syncProfile();toast('บันทึกโปรไฟล์เรียบร้อย')});
    $('chatForm').addEventListener('submit',async e=>{e.preventDefault();const text=$('chatInput').value.trim();if(!text||!selectedPartner)return;if(!selectedPartner)return toast('เลือกผู้รับก่อน');const ids=[currentUser.uid,selectedPartner.id].sort();const threadId=ids.join('_');await addDoc(collection(db,'threads',threadId,'messages'),{text,senderId:currentUser.uid,receiverId:selectedPartner.id,createdAt:serverTimestamp()});$('chatInput').value=''});
    document.addEventListener('click',e=>{const btn=e.target.closest('[data-chat]');if(btn)openChat(btn.dataset.chat)});

    boot();lucide.createIcons();
  </script>
</body>
</html>
